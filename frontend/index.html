<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — LGO Pharmacie Vétérinaire</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">🐾</div>
                <h1>LGO Pharmacie</h1>
                <p>Pharmacie vétérinaire</p>
            </div>

            <form id="loginForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="email">Adresse email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="admin@aspangozi.com"
                        required
                        autocomplete="email"
                        autofocus>
                    <span class="field-error" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        required
                        autocomplete="current-password">
                    <span class="field-error" id="passwordError"></span>
                </div>

                <div class="form-alert" id="globalError" hidden></div>

                <button type="submit" id="loginBtn" class="btn btn-primary">
                    Se connecter
                </button>
            </form>

            <div class="auth-footer">
                <small>© 2026 LGO Pharmacie Vétérinaire</small>
            </div>
        </div>
    </div>

    <!-- Scripts dans l'ordre (dépendances) -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/guards.js"></script>

    <script>
        // Rediriger si déjà connecté
        Guard.redirectIfAuthenticated();

        // Gestion du formulaire
        const form = document.getElementById('loginForm');
        const btn = document.getElementById('loginBtn');
        const globalError = document.getElementById('globalError');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Reset erreurs
            globalError.hidden = true;
            emailError.textContent = '';
            passwordError.textContent = '';

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            // Validation basique côté client
            let hasError = false;
            if (!email) {
                emailError.textContent = 'L\'email est obligatoire.';
                hasError = true;
            }
            if (!password) {
                passwordError.textContent = 'Le mot de passe est obligatoire.';
                hasError = true;
            }
            if (hasError) return;

            // Désactiver le bouton
            btn.disabled = true;
            btn.textContent = 'Connexion...';

            try {
                await Auth.login(email, password);
                window.location.href = CONFIG.ROUTES.DASHBOARD;
            } catch (error) {
                // Erreurs de validation Laravel
                if (error.errors.email) {
                    emailError.textContent = error.errors.email[0];
                }
                if (error.errors.password) {
                    passwordError.textContent = error.errors.password[0];
                }
                // Message global
                if (!error.errors.email && !error.errors.password) {
                    globalError.textContent = error.message;
                    globalError.hidden = false;
                }
            } finally {
                btn.disabled = false;
                btn.textContent = 'Se connecter';
            }
        });
    </script>

</body>
</html>
