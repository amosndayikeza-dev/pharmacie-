<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaccinations — LGO Pharmacie</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/vaccinations.css">
</head>
<body>

<div class="app-layout" id="appLayout">

    <aside class="sidebar" id="appSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <header class="header" id="appHeader"></header>

    <main class="main-content">

        <!-- Page header -->
        <div class="page-header">
            <div>
                <h1 class="page-title">Vaccinations</h1>
                <p class="page-subtitle">Suivi vaccinal et rappels des animaux</p>
            </div>
            <div class="page-actions">
                <button class="btn btn-secondary" id="showRappelsBtn">
                    <span data-icon="clock"></span>
                    Rappels à venir
                </button>
                <button class="btn btn-primary" id="addBtn">
                    <span data-icon="plus"></span>
                    Nouvelle vaccination
                </button>
            </div>
        </div>

        <!-- Alertes rappels en retard -->
        <div id="alertRetard" class="alert-banner alert-banner-danger" style="display: none;">
            <span data-icon="alert"></span>
            <span id="alertRetardText">—</span>
            <button class="btn btn-sm btn-secondary" id="showRetardBtn">Voir</button>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-search">
                <span class="search-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </span>
                <input type="text" id="searchInput" placeholder="Rechercher par vaccin, animal...">
            </div>

            <select id="filterAnimal">
                <option value="">Tous les animaux</option>
            </select>

            <select id="filterVeterinaire">
                <option value="">Tous les vétérinaires</option>
            </select>

            <select id="filterRappel">
                <option value="">Tous les statuts</option>
                <option value="proche">Rappel dans 30 jours</option>
                <option value="retard">Rappel en retard</option>
            </select>

            <button class="btn btn-secondary" id="resetFiltersBtn">
                <span data-icon="refresh"></span>
                Réinitialiser
            </button>
        </div>

        <!-- Tableau -->
        <article class="card">
            <div class="table-wrapper">
                <table class="data-table" id="vaccinationsTable">
                    <thead>
                        <tr>
                            <th>Vaccin</th>
                            <th>Animal</th>
                            <th>Vétérinaire</th>
                            <th>Date vaccination</th>
                            <th>Prochain rappel</th>
                            <th>Statut</th>
                            <th class="text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="vaccinationsTbody">
                        <tr>
                            <td colspan="7" class="empty">
                                <div class="spinner" style="margin: 20px auto;"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="paginationContainer"></div>
        </article>

    </main>

    <footer class="footer" id="appFooter"></footer>

</div>

<!-- ============================================================
     MODAL : Créer / Modifier une vaccination
     ============================================================ -->
<div class="modal-overlay" id="vaccinationModal">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">
                <span data-icon="syringe"></span>
                <span id="modalTitle">Nouvelle vaccination</span>
            </h3>
            <button class="modal-close" id="modalCloseBtn" type="button">
                <span data-icon="close"></span>
            </button>
        </div>

        <form id="vaccinationForm" style="display: contents;">
            <div class="modal-body">
                <input type="hidden" id="vaccinationId">

                <div class="form-grid">
                    <!-- Animal -->
                    <div class="form-field full-width">
                        <label for="animalId">Animal <span class="required">*</span></label>
                        <select id="animalId" name="animal_id" required>
                            <option value="">— Choisir un animal —</option>
                        </select>
                        <span class="field-error" data-error-for="animal_id"></span>
                    </div>

                    <!-- Vétérinaire -->
                    <div class="form-field">
                        <label for="veterinaireId">Vétérinaire</label>
                        <select id="veterinaireId" name="veterinaire_id">
                            <option value="">— Aucun —</option>
                        </select>
                        <span class="field-error" data-error-for="veterinaire_id"></span>
                    </div>

                    <!-- Médicament (vaccin du catalogue) -->
                    <div class="form-field">
                        <label for="medicamentId">Vaccin (catalogue)</label>
                        <select id="medicamentId" name="medicament_id">
                            <option value="">— Aucun —</option>
                        </select>
                        <span class="field-error" data-error-for="medicament_id"></span>
                    </div>

                    <!-- Nom du vaccin -->
                    <div class="form-field full-width">
                        <label for="nomVaccin">Nom du vaccin <span class="required">*</span></label>
                        <input type="text" id="nomVaccin" name="nom_vaccin" required maxlength="150" placeholder="Vaccin Rage, Fièvre aphteuse...">
                        <span class="field-error" data-error-for="nom_vaccin"></span>
                    </div>

                    <!-- Numéro de lot -->
                    <div class="form-field">
                        <label for="numeroLotVaccin">N° de lot du vaccin</label>
                        <input type="text" id="numeroLotVaccin" name="numero_lot_vaccin" maxlength="100" placeholder="LOT-2026-001">
                        <span class="field-error" data-error-for="numero_lot_vaccin"></span>
                    </div>

                    <!-- Date vaccination -->
                    <div class="form-field">
                        <label for="dateVaccination">Date de vaccination <span class="required">*</span></label>
                        <input type="date" id="dateVaccination" name="date_vaccination" required>
                        <span class="field-error" data-error-for="date_vaccination"></span>
                    </div>

                    <!-- Date prochain rappel -->
                    <div class="form-field">
                        <label for="dateProchainRappel">Date du prochain rappel</label>
                        <input type="date" id="dateProchainRappel" name="date_prochain_rappel">
                        <span class="field-error" data-error-for="date_prochain_rappel"></span>
                    </div>

                    <!-- Observations -->
                    <div class="form-field full-width">
                        <label for="observations">Observations</label>
                        <textarea id="observations" name="observations" rows="2" placeholder="Notes sur la vaccination..."></textarea>
                        <span class="field-error" data-error-for="observations"></span>
                    </div>

                    <!-- Réaction -->
                    <div class="form-field full-width">
                        <label for="reaction">Réaction éventuelle</label>
                        <textarea id="reaction" name="reaction" rows="2" placeholder="Réaction de l'animal après le vaccin..."></textarea>
                        <span class="field-error" data-error-for="reaction"></span>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="modalCancelBtn">Annuler</button>
                <button type="submit" form="vaccinationForm" class="btn btn-primary" id="modalSubmitBtn">
                    <span data-icon="check"></span>
                    <span id="submitBtnText">Créer</span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- ============================================================
     MODAL : Confirmation
     ============================================================ -->
<div class="modal-overlay" id="confirmModal">
    <div class="modal modal-sm">
        <div class="modal-header">
            <h3 class="modal-title">
                <span data-icon="alert"></span>
                Confirmation
            </h3>
            <button class="modal-close" id="confirmCloseBtn" type="button">
                <span data-icon="close"></span>
            </button>
        </div>
        <div class="modal-body">
            <p id="confirmMessage">Êtes-vous sûr ?</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="confirmCancelBtn">Annuler</button>
            <button class="btn btn-danger" id="confirmOkBtn">Confirmer</button>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="../assets/js/config.js"></script>
<script src="../assets/js/storage.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/guards.js"></script>
<script src="../assets/js/icons.js"></script>
<script src="../assets/js/toast.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/vaccinations.js"></script>

<script>
    Guard.requireAuth();

    document.addEventListener('DOMContentLoaded', () => {
        Layout.mount({
            activePage: 'vaccinations',
            title: 'Vaccinations',
            breadcrumb: 'Suivi médical',
        });
    });
</script>

</body>
</html>
