<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramètres — LGO Pharmacie</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/parametres.css">
</head>
<body>

<div class="app-layout" id="appLayout">
    <aside class="sidebar" id="appSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <header class="header" id="appHeader"></header>

    <main class="main-content">

        <div class="page-header">
            <div>
                <h1 class="page-title">Paramètres</h1>
                <p class="page-subtitle">Configuration de l'application</p>
            </div>
            <div class="page-actions">
                <button class="btn btn-primary" id="saveAllBtn">
                    <span data-icon="check"></span>
                    Enregistrer tout
                </button>
            </div>
        </div>

        <!-- Onglets -->
        <div class="tabs" id="tabs">
            <button class="tab active" data-group="pharmacie">🏥 Pharmacie</button>
            <button class="tab" data-group="facturation">💰 Facturation</button>
            <button class="tab" data-group="stock">📦 Stock</button>
            <button class="tab" data-group="systeme">⚙️ Système</button>
        </div>

        <!-- Loader -->
        <div id="loader" class="loader">
            <div class="spinner"></div>
            <span>Chargement des paramètres...</span>
        </div>

        <!-- Contenu -->
        <div id="content" hidden>

            <article class="card param-groupe" data-group="pharmacie">
                <div class="card-header">
                    <h3 class="card-title">
                        <span data-icon="info"></span>
                        Identité de la pharmacie
                    </h3>
                </div>
                <div class="card-body">
                    <div class="form-grid" id="parametres-pharmacie"></div>
                </div>
            </article>

            <article class="card param-groupe" data-group="facturation" hidden>
                <div class="card-header">
                    <h3 class="card-title">
                        <span data-icon="money"></span>
                        Facturation & tickets
                    </h3>
                </div>
                <div class="card-body">
                    <div class="form-grid" id="parametres-facturation"></div>
                </div>
            </article>

            <article class="card param-groupe" data-group="stock" hidden>
                <div class="card-header">
                    <h3 class="card-title">
                        <span data-icon="lots"></span>
                        Gestion du stock
                    </h3>
                </div>
                <div class="card-body">
                    <div class="form-grid" id="parametres-stock"></div>
                </div>
            </article>

            <article class="card param-groupe" data-group="systeme" hidden>
                <div class="card-header">
                    <h3 class="card-title">
                        <span data-icon="settings"></span>
                        Système & conformité
                    </h3>
                </div>
                <div class="card-body">
                    <div class="form-grid" id="parametres-systeme"></div>
                </div>
            </article>

        </div>

    </main>

    <footer class="footer" id="appFooter"></footer>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/storage.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/guards.js"></script>
<script src="../assets/js/icons.js"></script>
<script src="../assets/js/toast.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/parametres.js"></script>

<script>
    Guard.requireAuth();
    document.addEventListener('DOMContentLoaded', () => {
        Layout.mount({ activePage: 'parametres', title: 'Paramètres', breadcrumb: 'Configuration' });
    });
</script>

</body>
</html>
