<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fournisseurs — LGO Pharmacie</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/fournisseurs.css">
</head>
<body>

<div class="app-layout" id="appLayout">

    <aside class="sidebar" id="appSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <header class="header" id="appHeader"></header>

    <main class="main-content">

        <!-- Page header -->
        <div class="page-header">
            <div>
                <h1 class="page-title">Fournisseurs</h1>
                <p class="page-subtitle">Gérez les fournisseurs de médicaments vétérinaires</p>
            </div>
            <div class="page-actions">
                <button class="btn btn-primary" id="addBtn">
                    <span data-icon="plus"></span>
                    Nouveau fournisseur
                </button>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-search">
                <span class="search-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </span>
                <input type="text" id="searchInput" placeholder="Rechercher par nom, raison sociale, email...">
            </div>

            <select id="filterVille">
                <option value="">Toutes les villes</option>
            </select>

            <select id="filterActif">
                <option value="">Tous les statuts</option>
                <option value="true">Actifs</option>
                <option value="false">Inactifs</option>
            </select>

            <button class="btn btn-secondary" id="resetFiltersBtn">
                <span data-icon="refresh"></span>
                Réinitialiser
            </button>
        </div>

        <!-- Tableau -->
        <article class="card">
            <div class="table-wrapper">
                <table class="data-table" id="fournisseursTable">
                    <thead>
                        <tr>
                            <th>Nom</th>
                            <th>Contact</th>
                            <th>Adresse</th>
                            <th>Pays</th>
                            <th>Délai</th>
                            <th>Statut</th>
                            <th class="text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="fournisseursTbody">
                        <tr>
                            <td colspan="7" class="empty">
                                <div class="spinner" style="margin: 20px auto;"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="paginationContainer"></div>
        </article>

    </main>

    <footer class="footer" id="appFooter"></footer>

</div>

<!-- ============================================================
     MODAL : Créer / Modifier un fournisseur
     ============================================================ -->
<div class="modal-overlay" id="fournisseurModal">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">
                <span data-icon="fournisseurs"></span>
                <span id="modalTitle">Nouveau fournisseur</span>
            </h3>
            <button class="modal-close" id="modalCloseBtn" type="button">
                <span data-icon="close"></span>
            </button>
        </div>

        <form id="fournisseurForm">
            <div class="modal-body">
                <input type="hidden" id="fournisseurId">

                <div class="form-grid">
                    <div class="form-field">
                        <label for="nom">Nom commercial <span class="required">*</span></label>
                        <input type="text" id="nom" name="nom" required maxlength="150" placeholder="PHARMALAB Burundi">
                        <span class="field-error" data-error-for="nom"></span>
                    </div>

                    <div class="form-field">
                        <label for="raisonSociale">Raison sociale</label>
                        <input type="text" id="raisonSociale" name="raison_sociale" maxlength="200" placeholder="PHARMALAB SARL">
                        <span class="field-error" data-error-for="raison_sociale"></span>
                    </div>

                    <div class="form-field">
                        <label for="numeroContribuable">N° contribuable</label>
                        <input type="text" id="numeroContribuable" name="numero_contribuable" maxlength="50">
                        <span class="field-error" data-error-for="numero_contribuable"></span>
                    </div>

                    <div class="form-field">
                        <label for="delaiLivraison">Délai de livraison (jours)</label>
                        <input type="number" id="delaiLivraison" name="delai_livraison_jours" min="0" max="365">
                        <span class="field-error" data-error-for="delai_livraison_jours"></span>
                    </div>

                    <div class="form-field">
                        <label for="telephone">Téléphone</label>
                        <input type="text" id="telephone" name="telephone" maxlength="30" placeholder="+257 22 25 30 40">
                        <span class="field-error" data-error-for="telephone"></span>
                    </div>

                    <div class="form-field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" maxlength="150">
                        <span class="field-error" data-error-for="email"></span>
                    </div>

                    <div class="form-field">
                        <label for="ville">Ville</label>
                        <input type="text" id="ville" name="ville" maxlength="100" placeholder="Bujumbura">
                        <span class="field-error" data-error-for="ville"></span>
                    </div>

                    <div class="form-field">
                        <label for="pays">Pays</label>
                        <input type="text" id="pays" name="pays" maxlength="100" value="Burundi">
                        <span class="field-error" data-error-for="pays"></span>
                    </div>

                    <div class="form-field full-width">
                        <label for="adresse">Adresse</label>
                        <textarea id="adresse" name="adresse" maxlength="500" placeholder="Avenue de la Mission, N°12..."></textarea>
                        <span class="field-error" data-error-for="adresse"></span>
                    </div>

                    <div class="form-field full-width">
                        <label for="notes">Notes internes</label>
                        <textarea id="notes" name="notes" maxlength="1000" placeholder="Fournisseur principal, bon rapport qualité/prix..." row="2"></textarea>
                    </div>

                    <div class="form-field full-width">
                        <label class="form-checkbox">
                            <input type="checkbox" id="actif" name="actif" checked>
                            <span>Fournisseur actif</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="modalCancelBtn">
                    Annuler
                </button>
                <button type="submit" class="btn btn-primary" id="modalSubmitBtn">
                    <span data-icon="check"></span>
                    <span id="submitBtnText">Créer</span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- ============================================================
     MODAL : Confirmation
     ============================================================ -->
<div class="modal-overlay" id="confirmModal">
    <div class="modal modal-sm">
        <div class="modal-header">
            <h3 class="modal-title">
                <span data-icon="alert"></span>
                Confirmation
            </h3>
            <button class="modal-close" id="confirmCloseBtn" type="button">
                <span data-icon="close"></span>
            </button>
        </div>
        <div class="modal-body">
            <p id="confirmMessage">Êtes-vous sûr ?</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="confirmCancelBtn">Annuler</button>
            <button class="btn btn-danger" id="confirmOkBtn">Confirmer</button>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="../assets/js/config.js"></script>
<script src="../assets/js/storage.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/guards.js"></script>
<script src="../assets/js/icons.js"></script>
<script src="../assets/js/toast.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/fournisseurs.js"></script>

<script>
    Guard.requireAuth();

    document.addEventListener('DOMContentLoaded', () => {
        Layout.mount({
            activePage: 'fournisseurs',
            title: 'Fournisseurs',
            breadcrumb: 'Partenaires',
        });
    });
</script>

</body>
</html>
